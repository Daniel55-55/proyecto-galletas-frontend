<div class="mat-elevation-z8">
  <table mat-table [dataSource]="datosPaginados" class="tabla-generica">
    <ng-container *ngFor="let columna of displayedColumns" [matColumnDef]="columna">
      <th mat-header-cell *matHeaderCellDef>{{ columna | titlecase }}</th>
      <td mat-cell *matCellDef="let fila">{{ fila[columna] }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let fila; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
