<mat-toolbar color="primary" class="mat-elevation-z4">
  @if (estaLogueado()) {
    <button mat-icon-button [matMenuTriggerFor]="menu">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <span>Desarrollo Basado en Plataformas - Proyecto de Angular</span>
</mat-toolbar>

<mat-menu #menu="matMenu">
  <button mat-menu-item routerLink="/galletas-todas">
    <mat-icon>table_chart</mat-icon>
    <span>Todas las Galletas</span>
  </button>
  <button mat-menu-item routerLink="/galletas-chocolate">
    <mat-icon>cookie</mat-icon>
    <span>Galletas de Chocolate</span>
  </button>
  <button mat-menu-item routerLink="/galletas-vainilla">
    <mat-icon>bakery_dining</mat-icon>
    <span>Galletas de Vainilla</span>
  </button>
  <button mat-menu-item (click)="cerrarSesion()">
    <mat-icon>logout</mat-icon>
    <span>Cerrar sesión</span>
  </button>
</mat-menu>

<main class="content-container">
  <router-outlet></router-outlet>
</main>
