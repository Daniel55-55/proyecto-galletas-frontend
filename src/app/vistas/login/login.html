<div class="login-contenedor">
  <mat-card class="login-tarjeta">
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
      <mat-card-subtitle>Ingresa tus credenciales</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="ingresar()" class="login-formulario">
        <mat-form-field appearance="outline">
          <mat-label>Usuario</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input matInput name="usuario" [(ngModel)]="usuario">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput type="password" name="contrasena" [(ngModel)]="contrasena">
        </mat-form-field>

        @if (mensajeError) {
          <p class="login-error">{{ mensajeError }}</p>
        }

        <button mat-raised-button color="primary" type="submit">Ingresar</button>
      </form>
    </mat-card-content>

    <mat-card-actions class="login-acciones">
      <span>¿No tienes cuenta?</span>
      <a mat-button routerLink="/registro">Regístrate</a>
    </mat-card-actions>
  </mat-card>
</div>
