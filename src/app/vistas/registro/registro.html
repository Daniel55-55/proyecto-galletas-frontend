<div class="login-contenedor">
  <mat-card class="login-tarjeta">
    <mat-card-header>
      <mat-card-title>Crear cuenta</mat-card-title>
      <mat-card-subtitle>Elige un usuario y una contraseña</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="registrar()" class="login-formulario">
        <mat-form-field appearance="outline">
          <mat-label>Usuario</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input matInput name="usuario" [(ngModel)]="usuario">
          <mat-hint>Mínimo 4 caracteres, sin espacios</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput type="password" name="contrasena" [(ngModel)]="contrasena">
          <mat-hint>Mínimo 6 caracteres, con letras y números</mat-hint>
        </mat-form-field>

        @if (mensajeError) {
          <p class="login-error">{{ mensajeError }}</p>
        }

        <button mat-raised-button color="primary" type="submit">Registrarse</button>
      </form>
    </mat-card-content>

    <mat-card-actions class="login-acciones">
      <span>¿Ya tienes cuenta?</span>
      <a mat-button routerLink="/login">Inicia sesión</a>
    </mat-card-actions>
  </mat-card>
</div>
