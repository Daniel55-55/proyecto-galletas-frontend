<div style="margin-bottom: 15px;">
  <button mat-raised-button color="primary" (click)="mostrarFormulario = !mostrarFormulario">
    {{ mostrarFormulario ? 'Cerrar Formulario' : 'Agregar Nuevo Registro' }}
  </button>
</div>

<form *ngIf="mostrarFormulario" [formGroup]="formulario" (ngSubmit)="guardar()" style="display: flex; gap: 15px; margin-bottom: 20px; align-items: center; flex-wrap: wrap;">
  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="nombre">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Tamaño</mat-label>
    <input matInput formControlName="tamano">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Precio</mat-label>
    <input matInput type="number" formControlName="precio">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Cantidad</mat-label>
    <input matInput type="number" formControlName="cantidad">
  </mat-form-field>

  <button mat-raised-button color="accent" type="submit" [disabled]="formulario.invalid">
    Guardar
  </button>
</form>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <!-- ID -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let galleta"> {{ galleta.id }} </td>
  </ng-container>

  <!-- Nombre -->
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef> Nombre </th>
    <td mat-cell *matCellDef="let galleta"> {{ galleta.nombre }} </td>
  </ng-container>

  <!-- Tamaño -->
  <ng-container matColumnDef="tamano">
    <th mat-header-cell *matHeaderCellDef> Tamaño </th>
    <td mat-cell *matCellDef="let galleta"> {{ galleta.tamano }} </td>
  </ng-container>

  <!-- Precio -->
  <ng-container matColumnDef="precio">
    <th mat-header-cell *matHeaderCellDef> Precio </th>
    <td mat-cell *matCellDef="let galleta"> ${{ galleta.precio }} </td>
  </ng-container>

  <!-- Cantidad -->
  <ng-container matColumnDef="cantidad">
    <th mat-header-cell *matHeaderCellDef> Cantidad </th>
    <td mat-cell *matCellDef="let galleta"> {{ galleta.cantidad }} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
